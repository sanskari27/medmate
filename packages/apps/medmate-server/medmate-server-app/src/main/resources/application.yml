server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: medmate-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 40MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

medmate:
  medicine-data:
    base-url: https://medicine-data.nammamedmate.com

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
    java:
      enabled: true
