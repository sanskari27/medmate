spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/medmate_server
    username: pharmacy
    password: pharmacy
  flyway:
    enabled: true
    placeholders:
      clinicSeed: "TRUE"

medmate:
  jwt:
    secret: local-dev-jwt-secret-local-dev-jwt-32
    access-seconds: 900
    refresh-seconds: 2592000
  # A local run sends the same code every time, so a developer does not have to
  # read it out of the SMS mock. Every other environment sends a random one.
  otp:
    fixed-code: "12345"
  admin-bootstrap-token: local-bootstrap
  sms:
    base-url: http://127.0.0.1:8090
    api-key: ""
  mail:
    mode: recording
    from: "Medmate <noreply@nammamedmate.com>"
    resend-api-key: ""
  uploads:
    bucket: ""
    prefix: app-uploads/medmate-server
    region: ap-south-1
  catalog:
    url: jdbc:postgresql://127.0.0.1:5432/medicine_data
    username: medicine_data
    password: medicine_data
