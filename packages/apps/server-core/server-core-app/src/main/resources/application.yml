server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/pharmacy}
    username: ${SPRING_DATASOURCE_USERNAME:pharmacy}
    password: ${SPRING_DATASOURCE_PASSWORD:pharmacy}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  uploads-bucket: ${APP_UPLOADS_BUCKET:}
  uploads-prefix: ${APP_UPLOADS_PREFIX:}
  auth-jwt-secret: ${AUTH_JWT_SECRET:}
  master-phones: ${MASTER_PHONES:}
  production: ${APP_PRODUCTION:false}
