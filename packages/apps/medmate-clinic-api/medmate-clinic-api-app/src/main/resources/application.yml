spring:
  application:
    name: medmate-clinic-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medmate}
    username: ${SPRING_DATASOURCE_USERNAME:medmate}
    password: ${SPRING_DATASOURCE_PASSWORD:medmate}
  flyway:
    enabled: true
    # The service owns the registry schema. The per-clinic schemas in
    # db/migration belong to the clinic databases, not to the shared one.
    locations: classpath:db/registry-migration

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info

medmate:
  jwt:
    secret: ${MEDMATE_JWT_SECRET:01234567890123456789012345678901}
