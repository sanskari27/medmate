name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate project contracts
        run: python3 scripts/validate_projects.py

  changed:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List changed applications
        id: list
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo 'apps<<EOF'
            python3 scripts/list_changed_apps.py
            echo EOF
          } >> "$GITHUB_OUTPUT"

  quality:
    needs: [validate, changed]
    if: needs.validate.result == 'success' && needs.changed.result == 'success' && needs.changed.outputs.apps != '[]'
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/quality.yml
    with:
      apps: ${{ needs.changed.outputs.apps }}

  wait-infra:
    needs: changed
    if: needs.changed.result == 'success' && needs.changed.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for infra workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/wait_for_infra.py

  deploy:
    needs: [validate, changed, wait-infra, quality]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.changed.result == 'success' &&
      needs.wait-infra.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'failure') &&
      needs.changed.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changed.outputs.apps) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Wait for quality gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_quality.py "${{ matrix.app }}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy ${{ matrix.app }}
        run: python3 scripts/deploy_app.py "${{ matrix.app }}"
