name: Infra

on:
  pull_request:
    paths:
      - packages/infra/**
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - packages/infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
    defaults:
      run:
        working-directory: packages/infra/platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Initialize Terraform
        run: terraform init -backend-config=backend.hcl
      - name: Plan platform changes
        run: terraform plan -input=false
      - name: Apply platform changes
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve

  apps:
    needs: platform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [todo-react, todo-server, medmatepharmacy, nammamedmate, pharmacy, server-core]
    defaults:
      run:
        working-directory: packages/infra/${{ matrix.stack }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Initialize Terraform
        run: terraform init -backend-config=backend.hcl
      - name: Plan ${{ matrix.stack }} changes
        run: terraform plan -input=false
      - name: Apply ${{ matrix.stack }} changes
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve
